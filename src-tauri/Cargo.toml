[package]
name = "libera"
version = "0.1.0"
description = "A Tauri App"
authors = ["Derrick Christopher Hernández Rojas"]
edition = "2021"

[lib]
name = "libera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Optimise dependencies even in dev builds. `tauri dev` runs the debug profile, and an
# UNOPTIMISED `image`/`zune-jpeg` decodes a 100MP photo in ~20-30s (vs ~1s optimised) — which is
# what made thumbnails fail and the lightbox crawl during development. The local crate stays
# unoptimised so app recompiles remain fast.
[profile.dev.package."*"]
opt-level = 3
codegen-units = 16

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
dirs = "5"
tauri-plugin-dialog = "2.7"
walkdir = "2"
image = "0.25"
zip = "2"
urlencoding = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
base64 = "0.22"
exif = { package = "kamadak-exif", version = "0.5" }
chrono = "0.4"
